[build-system]
requires = ["setuptools>=77"]  # >=77 for PEP 639 license expressions
build-backend = "setuptools.build_meta"

[project]
name = "multi-tool-orchestrator-agent"
version = "0.1.0"
description = "Multi-tool orchestrator agent: dynamic tool registry, capability-based routing, permission scoping, parallel execution and conflict resolution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The set-union sign is used deliberately in docstrings describing scope algebra.
allowed-confusables = ["∪"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately embed non-ASCII look-alike characters (e.g. Arabic-Indic digits)
# to exercise identifier/name validation edge cases.
"tests/**" = ["RUF001"]
